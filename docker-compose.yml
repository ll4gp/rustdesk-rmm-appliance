# ==============================================================================
# MODE 1 (DEFAULT): PLUG-IN APPLIANCE FOR ANY EXISTING RUSTDESK INSTALLATION
# Runs only the RMM & Telemetry Appliance on port 3031 (no port 21115-21119 conflicts).
# Load your existing RustDesk Server IP/Domain & id_ed25519.pub key in the Web UI!
# ==============================================================================
services:
  dashboard:
    build: .
    container_name: rustdesk-rmm-appliance
    ports:
      - "${DASHBOARD_PORT:-3031}:3031"
    volumes:
      - ./data/dashboard:/usr/src/app/server/data
      - ./data/rustdesk:/usr/src/app/rustdesk-data:ro
    env_file:
      - .env
    environment:
      - PORT=3031
      - PUBLIC_DASHBOARD_PORT=${DASHBOARD_PORT:-3031}
      - SITE_NAME=${SITE_NAME:-RustDesk RMM Appliance}
      - APPLIANCE_HOST=${APPLIANCE_HOST:-}
      - RUSTDESK_SERVER=${RUSTDESK_SERVER:-}
      - RUSTDESK_RELAY_SERVER=${RUSTDESK_RELAY_SERVER:-}
      - RUSTDESK_KEY=${RUSTDESK_KEY:-}
      - APPLIANCE_SECONDARY_HOST=${APPLIANCE_SECONDARY_HOST:-}
      - RUSTDESK_KEY_PATH=/usr/src/app/rustdesk-data/id_ed25519.pub
      - DB_PATH=/usr/src/app/server/data/database.sqlite
    restart: unless-stopped
